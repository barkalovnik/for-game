<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хомяк Борис и Великий Цикл</title>
<style>
:root{--bg:#fff6e5;--card:#fff;--tx:#2b2140;--mu:#7a6d8f;--ac:#ff8a1f;--code:#2b2140;--ct:#ffe3b3;--ok:#1ea85a;--bad:#e5484d;--cell:#fff0d0;--cl:#f0d9a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1430;--card:#262046;--tx:#f3ecff;--mu:#a99cc9;--ac:#ffa047;--code:#120e24;--ct:#ffe3b3;--ok:#3ddc84;--bad:#ff6b6f;--cell:#322a58;--cl:#4a4078}}
:root[data-theme="dark"]{--bg:#1a1430;--card:#262046;--tx:#f3ecff;--mu:#a99cc9;--ac:#ffa047;--code:#120e24;--ct:#ffe3b3;--ok:#3ddc84;--bad:#ff6b6f;--cell:#322a58;--cl:#4a4078}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:1.4rem;margin:4px 0 0}
.sub{color:var(--mu);font-size:.9rem;margin:0 0 8px}
#levels{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#levels button{width:46px;height:46px;border-radius:12px;border:2px solid var(--cl);background:var(--card);color:var(--tx);font:700 1rem inherit;cursor:pointer;line-height:1.1;padding:0}
#levels button small{display:block;font-size:.6rem;color:var(--ac);letter-spacing:-1px}
#levels button.on{border-color:var(--ac);background:var(--ct);color:#2b2140}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 0 var(--cl)}
.card h2{margin:0 0 4px;font-size:1.15rem}
#goal{font-weight:700;color:var(--ac);margin-top:6px}
#field{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.cell{background:var(--cell);border:2px solid var(--cl);border-radius:10px;text-align:center;padding:2px 0;transition:.2s}
.cell small{display:block;font-size:.65rem;color:var(--mu)}
.cell b{font-size:1.3rem;font-weight:400}
.cell.eaten{background:var(--ok);border-color:var(--ok)}
.cell.bad{background:var(--bad);border-color:var(--bad);animation:sh .3s 2}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#ham{position:absolute;font-size:30px;line-height:1;text-align:center;transition:left .18s,top .18s,transform .6s,opacity .6s;pointer-events:none;z-index:2;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
#ham.fly{transform:translateY(-260px) rotate(900deg);opacity:0}
#bank{text-align:center;padding:10px}
#bv{font-size:3rem;font-weight:900;color:var(--ac);transition:transform .08s}
#bv.bump{transform:scale(1.12)}
#bi{color:var(--mu);font-family:monospace;min-height:1.4em}
#say{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--ct);color:#2b2140;min-height:1.4em}
#say.ok{background:var(--ok);color:#fff}#say.bad{background:var(--bad);color:#fff}
#code{background:var(--code);color:#e8e0ff;border-radius:12px;padding:12px;font:15px/2.1 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto}
.ln{padding:0 6px;border-radius:6px;white-space:nowrap}
.ln.run{background:rgba(255,160,71,.28)}
.k{color:#ff9bd2}.cm{color:#8f86b5}
.stp{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
.stp button{width:26px;height:26px;border-radius:8px;border:0;background:#4a4078;color:#fff;font-size:1rem;cursor:pointer;padding:0}
.stp input,#code select{background:#3a3162;color:#ffe3b3;border:1px solid #6a5ca8;border-radius:8px;font:inherit;height:30px}
.stp input{width:52px;text-align:center}
#code select{padding:0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.b{border:0;border-radius:12px;padding:11px 18px;font:700 1rem inherit;cursor:pointer;background:var(--cl);color:var(--tx)}
.b.go{background:var(--ac);color:#2b2140}.b.nx{background:var(--ok);color:#fff}
.b:disabled{opacity:.5;cursor:default}
.fx{position:fixed;top:-30px;font-size:26px;animation:fall 1.8s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐹 Хомяк Борис и Великий Цикл</h1>
  <p class="sub">Борис ленив и не хочет прыгать по клеткам вручную. Напиши за него цикл <code>for</code>!</p>
  <div id="levels"></div>

  <div class="card">
    <h2 id="ttl"></h2>
    <div id="story"></div>
    <div id="goal"></div>
  </div>

  <div class="card">
    <div id="field"></div>
    <div id="bank" hidden><div id="bv">0</div><div id="bi"></div></div>
    <div id="say"></div>
  </div>

  <div class="card">
    <div id="code"></div>
    <div class="row">
      <button class="b go" id="run">▶ Запустить</button>
      <button class="b" id="rst">↺ Сброс</button>
      <button class="b" id="hint">💡 Подсказка</button>
      <button class="b nx" id="next" hidden>Дальше ▶</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => isFinite(n) ? n.toLocaleString("ru-RU") : "∞";
const pick = a => a[Math.floor(Math.random() * a.length)];

// формулы для тела цикла
const FN = {
  "i": i => i, "i + 1": i => i + 1, "i * 2": i => i * 2, "i * 3": i => i * 3,
  "i * i": i => i * i, "i * i + 1": i => i * i + 1,
  "i * (i + 1) // 2": i => Math.floor(i * (i + 1) / 2), "2 ** i": i => 2 ** i
};
// как в Python: range(a, b, c)
function range(a, b, c) {
  const r = [];
  if (c > 0) for (let i = a; i < b; i += c) r.push(i);
  else if (c < 0) for (let i = a; i > b; i += c) r.push(i);
  return r;
}

// k: eat — съесть сыр по клеткам; sum — накопить сумму. s — эталонное решение [start, stop, step, формула]
const LV = [
  { k: "eat", n: 10, s: [1, 6, 1, "i"], t: "Первый прыжок", st: "Борис проспал обед. Сыр лежит в клетках 1–5, а дальше — подлая брокколи. Пиши цикл, Борис не станет прыгать вручную!", h: "range(старт, стоп, шаг): стоп НЕ включается! Чтобы дойти до 5, ставь стоп = 6." },
  { k: "eat", n: 16, s: [0, 16, 2, "i"], t: "Только чётные", st: "Борис — перфекционист: ест сыр лишь в чётных клетках. Нечётные он считает мещанством.", h: "Чётные идут через одну: шаг = 2. Начни с 0." },
  { k: "eat", n: 21, s: [5, 21, 5, "i"], t: "Пятёрочка", st: "Сыр лежит через каждые 5 клеток. Борис считает по пятёркам, как продавец на рынке.", h: "Старт = 5, шаг = 5, а стоп = 21, чтобы клетка 20 вошла." },
  { k: "eat", n: 20, s: [19, 0, -3, "i"], t: "Задом наперёд", st: "Борис застрял в конце поля и умеет только пятиться. Шаг в range может быть отрицательным!", h: "Старт = 19, шаг = −3, а стоп должен быть ЛЕВЕЕ последней клетки с сыром (1). Например, 0." },
  { k: "eat", n: 30, s: [1, 6, 1, "i * i"], t: "Квадратный сыр", st: "Сыр лежит в клетках 1, 4, 9, 16, 25. Знакомые числа? Это квадраты! Шагом тут не обойтись — нужна формула в теле цикла.", h: "Пусть i бежит от 1 до 5 (стоп = 6), а в теле выбери i * i." },
  { k: "eat", n: 30, s: [1, 6, 1, "i * i + 1"], t: "Квадрат плюс один", st: "Теперь сыр в клетках 2, 5, 10, 17, 26. Борис добавил себе к каждому квадрату по лишнему кусочку.", h: "Тот же цикл с i от 1 до 5, формула i * i + 1." },
  { k: "eat", n: 30, s: [1, 8, 1, "i * (i + 1) // 2"], t: "Треугольный сыр", st: "Сыр в клетках 1, 3, 6, 10, 15, 21, 28. Это треугольные числа: 1, 1+2, 1+2+3… Борис хвастается, что учился в геометрической школе.", h: "i от 1 до 7 (стоп = 8), формула i * (i + 1) // 2." },
  { k: "eat", n: 20, s: [0, 5, 1, "2 ** i"], t: "Степени двойки", st: "Сыр размножается делением: 1, 2, 4, 8, 16. Борис-биолог в полном восторге.", h: "i от 0 до 4 (стоп = 5), формула 2 ** i — это «два в степени i»." },
  { k: "sum", s: [1, 11, 1, "i"], t: "Копилка", st: "Борис копит монеты на новое хомячье колесо: в i-й день кладёт в копилку i монет. Сколько будет за 10 дней?", h: "Сложи числа от 1 до 10: range(1, 11, 1), в теле просто i." },
  { k: "sum", s: [1, 101, 1, "i"], t: "Маленький Гаусс", st: "Учитель велел сложить числа от 1 до 100 и ушёл пить чай. Школьник Гаусс догадался за минуту, а твой цикл справится ещё быстрее.", h: "range(1, 101, 1), в теле i. Ответ — 5050." },
  { k: "sum", s: [2, 101, 2, "i"], t: "Чётные монеты", st: "Борис стал разборчив: монеты берёт только в чётные дни. Сумма 2 + 4 + … + 100.", h: "Старт = 2, стоп = 101, шаг = 2, в теле i." },
  { k: "sum", s: [1, 11, 1, "i * i"], t: "Босс: казна квадратов", st: "Финал! Казна хомячьего королевства: 1² + 2² + … + 10². Справишься — станешь почётным хомяком-программистом.", h: "range(1, 11, 1), в теле i * i." }
];

let L = 0, cheese = new Set(), eaten = new Set(), target = 0, runs = 0, hinted = false, busy = false, token = 0, curK = 0;
let prog = {};
try { prog = JSON.parse(localStorage.getItem("hamster") || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem("hamster", JSON.stringify(prog)); } catch (e) {} };

function nav() {
  $("#levels").innerHTML = LV.map((l, i) =>
    `<button data-l="${i}" class="${i === L ? "on" : ""}">${i + 1}<small>${"★".repeat(prog[i] || 0) || "·"}</small></button>`).join("");
}
function say(msg, cls) { const e = $("#say"); e.textContent = msg; e.className = cls || ""; }
const stp = (id, v) => `<span class="stp"><button data-t="${id}" data-d="-1">−</button><input id="${id}" type="number" inputmode="numeric" value="${v}"><button data-t="${id}" data-d="1">+</button></span>`;

function buildEditor(v) {
  const opts = Object.keys(FN).map(k => `<option>${k}</option>`).join("");
  const body = v.k === "eat" ? `eat(<select id="pf">${opts}</select>)` : `total += <select id="pf">${opts}</select>`;
  $("#code").innerHTML =
    (v.k === "sum" ? `<div class="ln"><span class="cm">total = 0  # копилка пуста</span></div>` : "") +
    `<div class="ln" id="l0"><span class="k">for</span> i <span class="k">in</span> range(${stp("pa", 0)}, ${stp("pb", 3)}, ${stp("pc", 1)}):</div>` +
    `<div class="ln" id="l1">&nbsp;&nbsp;&nbsp;&nbsp;${body}</div>` +
    (v.k === "sum" ? `<div class="ln"><span class="k">print</span>(total)</div>` : "");
}

function buildField(v) {
  const eat = v.k === "eat";
  $("#field").hidden = !eat;
  $("#bank").hidden = eat;
  if (eat) {
    let h = "";
    for (let j = 0; j < v.n; j++) h += `<div class="cell" data-i="${j}"><small>${j}</small><b>${cheese.has(j) ? "🧀" : "🥦"}</b></div>`;
    $("#field").innerHTML = h + `<div id="ham">🐹</div>`;
  }
}

function put(k) {
  curK = k;
  const c = document.querySelector(`.cell[data-i="${k}"]`), h = $("#ham");
  if (!c || !h) return;
  h.style.width = c.offsetWidth + "px";
  h.style.left = c.offsetLeft + "px";
  h.style.top = (c.offsetTop - 4) + "px";
}

function load(i) {
  token++; busy = false; L = i; runs = 0; hinted = false;
  const v = LV[i], [a, b, c, f] = v.s, out = range(a, b, c).map(FN[f]);
  if (v.k === "eat") cheese = new Set(out); else target = out.reduce((x, y) => x + y, 0);
  $("#ttl").textContent = `Уровень ${i + 1}: ${v.t}`;
  $("#story").textContent = v.st;
  $("#goal").textContent = v.k === "eat"
    ? `Цель: съесть весь 🧀 (${cheese.size} шт.) и не тронуть ни одной 🥦. Клетки: 0…${v.n - 1}`
    : `Цель: накопить ровно ${fmt(target)} монет 💰`;
  buildEditor(v); buildField(v);
  $("#next").hidden = true; $("#run").disabled = false;
  nav(); reset();
}

function reset() {
  if (busy) return;
  token++;
  eaten = new Set();
  document.querySelectorAll(".cell").forEach(c => {
    c.className = "cell";
    c.querySelector("b").textContent = cheese.has(+c.dataset.i) ? "🧀" : "🥦";
  });
  const h = $("#ham"); if (h) h.className = "";
  put(0);
  $("#bv").textContent = "0"; $("#bi").textContent = "";
  ["l0", "l1"].forEach(id => $("#" + id).classList.remove("run"));
  say("Настрой цикл (старт, стоп, шаг и формулу) и жми «Запустить».");
}

async function run() {
  if (busy) return;
  reset();
  const v = LV[L], tok = ++token;
  const a = +$("#pa").value, b = +$("#pb").value, c = +$("#pc").value, f = FN[$("#pf").value];
  runs++; busy = true; $("#run").disabled = true;
  const done = () => { busy = false; $("#run").disabled = false; };

  if (c === 0) { say("ValueError: шаг не может быть 0. Борис бежит на месте и лысеет 🏃", "bad"); return done(); }
  const it = range(a, b, c);
  if (!it.length) { say("Цикл не выполнился ни разу: range пустой. Подумай про направление шага! 🤔", "bad"); return done(); }
  const d = Math.min(450, Math.max(25, 2800 / it.length));
  let total = 0;

  for (const i of it) {
    $("#l0").classList.add("run"); $("#bi").textContent = `i = ${i}`;
    await sleep(d / 3); if (tok !== token) return;
    $("#l0").classList.remove("run"); $("#l1").classList.add("run");
    const k = f(i);
    if (v.k === "eat") {
      const cell = document.querySelector(`.cell[data-i="${k}"]`);
      if (!cell) {
        $("#ham").classList.add("fly");
        say(`Борис прыгнул в клетку ${fmt(k)}, которой нет. Теперь он в другом измерении 🌀`, "bad");
        return done();
      }
      put(k); await sleep(d); if (tok !== token) return;
      if (cheese.has(k)) { eaten.add(k); cell.classList.add("eaten"); cell.querySelector("b").textContent = "😋"; }
      else { cell.classList.add("bad"); say(pick([`Бе-е! В клетке ${k} брокколи! Борис в ярости 🥦`, `Клетка ${k}: брокколи. Борис оскорблён до глубины души 🥦`, `Борис укусил брокколи в клетке ${k} и теперь не разговаривает с тобой 😤`]), "bad"); return done(); }
    } else {
      total += k;
      $("#bv").textContent = fmt(total); $("#bv").classList.add("bump");
      await sleep(d); if (tok !== token) return;
      $("#bv").classList.remove("bump");
    }
  }
  $("#l1").classList.remove("run");

  if (v.k === "eat") {
    const left = cheese.size - eaten.size;
    if (left) { say(`Борис всё ещё голоден: осталось кусочков сыра — ${left}. Загляни в стоп, шаг и формулу!`, "bad"); return done(); }
  } else if (total !== target) {
    say(total < target ? `Не хватает ${fmt(target - total)} монет. Борис грустно трясёт пустой копилкой 🪙` : `Перебор на ${fmt(total - target)}! Копилка лопнула, Борис в шоке 💥`, "bad");
    return done();
  }
  win(); done();
}

function win() {
  const stars = hinted ? Math.min(2, runs === 1 ? 3 : runs <= 3 ? 2 : 1) : (runs === 1 ? 3 : runs <= 3 ? 2 : 1);
  prog[L] = Math.max(prog[L] || 0, stars); save(); nav();
  const wins = LV[L].k === "sum"
    ? ["Копилка полна! Борис танцует на монетах. ", "Ровно столько, сколько нужно. Борис нанимает тебя бухгалтером. "]
    : ["Сыр съеден, хомяк счастлив. Цикл — это сила! ", "Борис сыт и мечтает выучить Python. ", "Идеально! Борис пишет тебе рекомендательное письмо. "];
  say(pick(wins) + "★".repeat(stars), "ok");
  boom();
  if (L < LV.length - 1) $("#next").hidden = false;
  else {
    const sum = LV.reduce((s, _, i) => s + (prog[i] || 0), 0);
    say(`🏆 Все уровни пройдены! Звёзд: ${sum} из ${LV.length * 3}. Борис провозглашает тебя Великим Циклистом!`, "ok");
  }
}

function boom() {
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("span");
    s.className = "fx"; s.textContent = pick(["🧀", "🎉", "⭐", "🐹", "💰"]);
    s.style.left = Math.random() * 95 + "vw"; s.style.animationDelay = Math.random() * 0.5 + "s";
    document.body.appendChild(s); setTimeout(() => s.remove(), 2600);
  }
}

// ===== события =====
function clampInput(el) {
  const lim = el.id === "pc" ? [-20, 20] : [-10, 150];
  let n = Math.round(+el.value); if (isNaN(n)) n = 0;
  el.value = Math.max(lim[0], Math.min(lim[1], n));
}
$("#code").addEventListener("click", e => {
  const t = e.target.dataset.t; if (!t || busy) return;
  const el = $("#" + t); el.value = +el.value + +e.target.dataset.d; clampInput(el); reset();
});
$("#code").addEventListener("change", e => { if (busy) return; if (e.target.tagName === "INPUT") clampInput(e.target); reset(); });
$("#levels").addEventListener("click", e => { const b = e.target.closest("button"); if (b) load(+b.dataset.l); });
$("#run").onclick = run;
$("#rst").onclick = () => { busy = false; token++; $("#run").disabled = false; reset(); };
$("#next").onclick = () => load(L + 1);
$("#hint").onclick = () => { hinted = true; say("💡 " + LV[L].h); };
window.addEventListener("resize", () => put(curK));

load(0);
</script>
</body>
</html>
